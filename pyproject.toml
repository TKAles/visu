[project]
name = "visu3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pyfftw>=0.15.1",
    "pyside6>=6.10.2",
    "scipy>=1.17.0",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x; sys_platform != 'darwin'",
]

[tool.uv]
# Ensure the lock file resolves wheels for all three target platforms.
# Without this uv only resolves for the current OS, so Windows/Linux
# installs may fail to find pre-resolved hashes.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
